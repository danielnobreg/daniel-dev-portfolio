<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel Nóbrega | Mensagem Enviada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;700&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .thanks-section {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding-top: 50px;
        }
        .thanks-card {
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-lg);
        }
        .thanks-title {
            font-family: var(--font-oswald);
            font-size: var(--title-hero);
            text-transform: uppercase;
            font-weight: 700;
            line-height: 0.95;
            letter-spacing: -0.02em;
        }
        .thanks-desc {
            color: var(--text-muted);
            font-size: var(--text-large);
            font-weight: 300;
            margin-bottom: var(--space-lg);
        }
        .thanks-icon {
            color: var(--accent-chumbo);
            width: 60px;
            height: 60px;
            margin-bottom: var(--space-sm);
        }
        .nav-center { display: flex; }
    </style>
</head>
<body>
    <canvas id="glcanvas"></canvas>
    <div class="cursor"></div>
    
    <nav class="navbar">
        <div class="logo">DANIEL</div>
        
        <div class="nav-controls">
            <div class="lang-toggle">
                <span id="lang-pt" class="active">PT</span> | <span id="lang-en">EN</span>
            </div>
        </div>
    </nav>

    <main>
        <section class="thanks-section fade-up">
            <div class="thanks-card">
                <i data-lucide="check-circle" class="thanks-icon"></i>
                <h1 class="thanks-title" data-i18n="thanks.title">Mensagem Enviada!</h1>
                <p class="thanks-desc" data-i18n="thanks.desc">Obrigado por entrar em contato. Retornarei o mais breve possível.</p>
                <a href="index.html" class="btn brutal-btn" data-magnetic>
                    <i data-lucide="arrow-left"></i>
                    <span data-i18n="thanks.back">Voltar para o Início</span>
                </a>
            </div>
        </section>
    </main>

    <!-- Scripts necessários (Lenis / GSAP / etc não configurados aqui se não for rolável, mas usaremos script.js para I18n) -->
    <!-- Para o site thanks, lenis não é obrigatório, mas vamos manter o script para as traduções -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.34/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/gsap@3/dist/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
